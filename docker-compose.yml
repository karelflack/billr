version: "3.9"

# Billr — Local Development Stack
#
# Usage:
#   docker compose up             — start all services
#   docker compose up api worker  — start only API and worker
#   docker compose down -v        — stop and remove volumes (resets DB + Redis)
#
# First-time setup:
#   1. Copy .env.example to .env and fill in values
#   2. docker compose up postgres redis -d
#   3. docker compose run --rm api npx prisma migrate dev
#   4. docker compose up

services:

  # ---------------------------------------------------------------------------
  # REST API
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: development
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://billr:billr_dev@postgres:5432/billr}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      WEBHOOK_SECRET_ENCRYPTION_KEY: ${WEBHOOK_SECRET_ENCRYPTION_KEY}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: development
      FRONTEND_URL: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      # Mount source for live reloading in development
      # node_modules lives in the image layer — no named volume needed
      # because ./api/src (not ./api) is mounted, so node_modules is never shadowed.
      - ./api/src:/app/src:ro
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # BullMQ Webhook Worker
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: development
    command: npm run worker
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://billr:billr_dev@postgres:5432/billr}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      WEBHOOK_SECRET_ENCRYPTION_KEY: ${WEBHOOK_SECRET_ENCRYPTION_KEY}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: development
      FRONTEND_URL: http://localhost:5173
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-10}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./api/src:/app/src:ro
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # React Frontend (Vite dev server)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3001
    depends_on:
      - api
    volumes:
      - ./frontend/src:/app/src:ro
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # PostgreSQL 15
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: billr
      POSTGRES_USER: billr
      POSTGRES_PASSWORD: billr_dev
    volumes:
      - billr_postgres:/var/lib/postgresql/data
    # Healthcheck so dependent services wait until Postgres is accepting connections
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billr -d billr"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Redis 7 (with AOF persistence so data survives restarts)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - billr_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

# =============================================================================
# Named volumes
# =============================================================================
volumes:
  billr_postgres:
    driver: local
  billr_redis:
    driver: local
